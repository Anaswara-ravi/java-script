function addStudent() {
    let id = prompt("Enter ID:");
    let name = prompt("Enter name:");
    let age = prompt("Enter age:");
    let course = prompt("Enter course:");

    localStorage.setItem("id", id);
    localStorage.setItem("name", name);
    localStorage.setItem("age", age);
    localStorage.setItem("course", course);

    console.log("Student added");
}

function viewStudent() {
    let id = localStorage.getItem("id");

    if (id === null) {
        console.log("No student found");
    } else {
        console.log("ID:", id);
        console.log("Name:", localStorage.getItem("name"));
        console.log("Age:", localStorage.getItem("age"));
        console.log("Course:", localStorage.getItem("course"));
    }
}


function deletestudent(){
    localStorage.deletestudent("id")
    localStorage.deletestudent("name")
    localStorage.deletestudent("age")
    localStorage.deletestudent("course")


    console.log("delete student details!!!!!!!")
}
let choice;

while (choice !== 4) {
    choice = Number(prompt(
        "1. Add Student\n" +
        "2. View Student\n" +
        "3. Delete Student\n" +
        "4. Exit\n" +
        "Enter choice:"
    ));

    if (choice === 1) {
        addStudent();
    } else if (choice === 2) {
        viewStudent();
    } else if (choice === 3) {
        deleteStudent();
    } else if (choice === 4) {
        alert("Program exited");
    } else {
        alert("Invalid choice");
    }
}
